services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - vetplatform-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=VetPlatform;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Issuer: VetPlatform
      Jwt__Audience: VetPlatform.Client
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__AccessTokenExpirationMinutes: "30"
      Jwt__RefreshTokenExpirationDays: "7"
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
      # Bootstraps the first login (superadmin@vetplatform.dev / admin@vetplatform.dev)
      # since there's no self-registration. See docs/DEPLOYMENT.md for the
      # "log in, create the real clinic, retire the demo accounts" steps.
      Seed__DemoData: "true"
      Seed__DemoAdminPassword: ${DEMO_ADMIN_PASSWORD}
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  vetplatform-sql-data:

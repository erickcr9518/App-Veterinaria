name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build backend/VetPlatform.sln --configuration Release
      - run: dotnet test backend/VetPlatform.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CiTest123!Strong"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiTest123!Strong' -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=VetPlatform;User Id=sa;Password=CiTest123!Strong;TrustServerCertificate=True"
      Jwt__Issuer: VetPlatform
      Jwt__Audience: VetPlatform.Client
      Jwt__SigningKey: "ci-only-signing-key-not-used-anywhere-real-32bytes"
      Jwt__AccessTokenExpirationMinutes: "30"
      Jwt__RefreshTokenExpirationDays: "7"
      Seed__DemoData: "true"
      Seed__DemoAdminPassword: "Admin123!"
      # Rate limiting is deliberately generous here — matches
      # frontend/playwright.config.ts's own override for local runs, since
      # the E2E suite performs several login/logout calls from one IP.
      RateLimiting__Auth__PermitLimit: "1000"
      RateLimiting__Auth__WindowSeconds: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Restore and build the API once, so Playwright's webServer only has to launch it
        run: dotnet build backend/src/VetPlatform.Api
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright's Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the E2E suite
        working-directory: frontend
        run: npx playwright test
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write a CI-only .env
        run: |
          cat > .env <<'ENVEOF'
          SQL_SA_PASSWORD=CiTest123!Strong
          JWT_SIGNING_KEY=ci-only-signing-key-not-used-anywhere-real-32bytes
          FRONTEND_ORIGIN=http://localhost:8080
          PASSWORD_RESET_URL_BASE=http://localhost:8080/reset-password
          SMTP_HOST=
          SMTP_PORT=587
          SMTP_ENABLE_SSL=true
          SMTP_FROM_EMAIL=
          SMTP_FROM_NAME=VetPlatform
          SMTP_USERNAME=
          SMTP_PASSWORD=
          DEMO_ADMIN_PASSWORD=CiDemoAdmin123!
          ENVEOF
      - name: Build and start the full stack (this is the actual docker-compose.yml a pilot deploy would run)
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Verify the API's health endpoint (direct, bypassing nginx)
        run: curl -f http://localhost:5000/health
      - name: Verify the frontend serves the app
        run: curl -f http://localhost:8080/
      - name: Verify the frontend's nginx proxies /api/* to the API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"nobody@example.test","password":"wrong"}')
          echo "Got status $status"
          test "$status" = "401"
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="brand">
      <span class="brand-mark">🐾</span>
      <div>
        <h1>Restablecer contraseña</h1>
        <p>VetPlatform</p>
      </div>
    </div>

    <label class="field">
      <span>Correo electrónico</span>
      <input type="email" formControlName="email" autocomplete="username" placeholder="nombre@clinica.com" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <small>Ingresa un correo electrónico válido.</small>
      }
    </label>

    @if (successMessage()) {
      <div class="success-banner">{{ successMessage() }}</div>
    }

    @if (resetUrl()) {
      <a class="dev-link" [href]="resetUrl()">Abrir enlace de desarrollo</a>
    }

    @if (errorMessage()) {
      <div class="error-banner">{{ errorMessage() }}</div>
    }

    <button type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Enviando…' : 'Enviar instrucciones' }}
    </button>

    <a class="secondary-link" routerLink="/login">Volver al login</a>
  </form>
</div>

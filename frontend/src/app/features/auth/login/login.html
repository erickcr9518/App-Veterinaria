<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="brand">
      <span class="brand-mark">🐾</span>
      <div>
        <h1>VetPlatform</h1>
        <p>Gestión clínica veterinaria</p>
      </div>
    </div>

    <label class="field">
      <span>Correo electrónico</span>
      <input type="email" formControlName="email" autocomplete="username" placeholder="nombre@clinica.com" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <small>Ingresa un correo electrónico válido.</small>
      }
    </label>

    <label class="field">
      <span>Contraseña</span>
      <input type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <small>La contraseña es obligatoria.</small>
      }
    </label>

    @if (errorMessage()) {
      <div class="error-banner">{{ errorMessage() }}</div>
    }

    <button type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Ingresando…' : 'Ingresar' }}
    </button>

    <a class="secondary-link" routerLink="/forgot-password">Olvidé mi contraseña</a>
  </form>
</div>

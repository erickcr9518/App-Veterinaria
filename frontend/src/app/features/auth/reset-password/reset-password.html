<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="brand">
      <span class="brand-mark">🐾</span>
      <div>
        <h1>Nueva contraseña</h1>
        <p>VetPlatform</p>
      </div>
    </div>

    <label class="field">
      <span>Correo electrónico</span>
      <input type="email" formControlName="email" autocomplete="username" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <small>Ingresa un correo electrónico válido.</small>
      }
    </label>

    <label class="field">
      <span>Código de restablecimiento</span>
      <input type="text" formControlName="token" autocomplete="off" />
      @if (form.controls.token.invalid && form.controls.token.touched) {
        <small>El código es obligatorio.</small>
      }
    </label>

    <label class="field">
      <span>Nueva contraseña</span>
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
      @if (form.controls.newPassword.invalid && form.controls.newPassword.touched) {
        <small>Usa al menos 8 caracteres.</small>
      }
    </label>

    <label class="field">
      <span>Confirmar contraseña</span>
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
    </label>

    @if (successMessage()) {
      <div class="success-banner">{{ successMessage() }}</div>
    }

    @if (errorMessage()) {
      <div class="error-banner">{{ errorMessage() }}</div>
    }

    <button type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Guardando…' : 'Actualizar contraseña' }}
    </button>

    <a class="secondary-link" routerLink="/login">Volver al login</a>
  </form>
</div>
